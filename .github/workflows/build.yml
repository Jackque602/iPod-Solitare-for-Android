name: Build & Test

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Engine unit tests
        run: ./gradlew :engine:test

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: solitaire-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Keep a rolling "latest" release so the APK has a stable,
      # login-free direct download link that works from a phone browser:
      # https://github.com/<owner>/<repo>/releases/latest/download/app-debug.apk
      - name: Publish APK to the latest release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Latest debug build" \
              --notes "Rolling debug APK, replaced by CI on every push." \
              --target "$GITHUB_SHA"
          gh release upload latest app/build/outputs/apk/debug/app-debug.apk --clobber
          gh release edit latest --notes "Debug APK built from ${GITHUB_SHA} ($(date -u +'%Y-%m-%d %H:%M UTC'))."

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            engine/build/reports/tests
            app/build/reports/tests
          if-no-files-found: ignore

  instrumented:
    name: Compose UI tests (emulator)
    runs-on: ubuntu-latest
    # Emulator jobs are slower; run them only when manually requested.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Compose UI tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests
          if-no-files-found: ignore
